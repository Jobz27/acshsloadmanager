<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AC SHS Load Manager | Teacher Access</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/Y7gR9QbY/AC-SHS-Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* ================= BASE + THEME TOKENS (same as the admin app) ================= */
    :root {
      --bg: #e4e5ff;
      --ink: #0d1226;
      --mute: #444d68;
      --line: #eceef5;
      --bad: #b42318;
      --ok: #2fbf8a;
      --warn: #f5a524;
      --pri: #4338ca;
      --pri2: #7c3aed;
      --glow: rgba(67, 56, 202, .32);
      --soft: #e3e4ff;
      --soft2: #f0f0ff;
      --bd: #cfcfff;
      --surf: #fff;
      --surf2: #fafbfe;
      --hov: #f6f7fc;
      --track: #eef0f7;
      --hero1: #c9c8ff;
      --hero2: #ecd9ff;
      --cardbg: rgba(247, 247, 255, .92);
      --blob1: #b4b1ff;
      --blob2: #e0b8ff;
      --blob3: #b9e8d3;
      --hbg: linear-gradient(110deg, #3730a3, #6d28d9);
      --edge: color-mix(in srgb, var(--pri) 55%, #fff);
      --edge2: color-mix(in srgb, var(--pri) 30%, #fff);
      --k: 1;
      --kd: calc(1 + (var(--k) - 1) * .6);
    }

    [data-theme=ocean] {
      --pri: #0369a1;
      --pri2: #2563eb;
      --glow: rgba(3, 105, 161, .32);
      --bg: #cdeaf7;
      --soft: #d3effb;
      --soft2: #e8f7fd;
      --bd: #a7daf0;
      --hero1: #a5dcf3;
      --hero2: #b9cdf8;
      --cardbg: rgba(236, 249, 255, .92);
      --blob1: #7dd3f0;
      --blob2: #93b4f5;
      --blob3: #99e6d6;
      --hov: #f2f9fd;
      --surf2: #f7fbfe;
      --track: #e6f1f7;
      --hbg: linear-gradient(110deg, #075985, #0e7490);
    }

    [data-theme=forest] {
      --pri: #047857;
      --pri2: #4d7c0f;
      --glow: rgba(4, 120, 87, .32);
      --bg: #cdebd6;
      --soft: #d5f2de;
      --soft2: #e9f8ee;
      --bd: #a9dfbc;
      --hero1: #a9e0ba;
      --hero2: #d3e8a6;
      --cardbg: rgba(240, 252, 243, .92);
      --blob1: #86d3a1;
      --blob2: #c4e07a;
      --blob3: #9fdcc2;
      --hov: #f3faf5;
      --surf2: #f8fcf9;
      --track: #e6f0e9;
      --hbg: linear-gradient(110deg, #064e3b, #3f6212);
    }

    [data-theme=sunset] {
      --pri: #c2410c;
      --pri2: #be185d;
      --glow: rgba(194, 65, 12, .32);
      --bg: #ffd9bf;
      --soft: #ffe6d1;
      --soft2: #fff2e6;
      --bd: #ffc9a3;
      --hero1: #ffc49c;
      --hero2: #ffb5d3;
      --cardbg: rgba(255, 246, 238, .92);
      --blob1: #ffa66b;
      --blob2: #ff9fc4;
      --blob3: #ffd36b;
      --hov: #fff8f3;
      --surf2: #fffaf6;
      --track: #f5e8df;
      --hbg: linear-gradient(110deg, #9a3412, #9d174d);
    }

    [data-theme=dark] {
      color-scheme: dark;
      --bg: #080a14;
      --ink: #f1f3ff;
      --mute: #c4cbe8;
      --line: #343b5c;
      --bad: #ff8a8a;
      --pri: #b3b3ff;
      --pri2: #c4a8ff;
      --glow: rgba(139, 139, 255, .35);
      --soft: #2a2f55;
      --soft2: #22274a;
      --bd: #3b4175;
      --surf: #181c2e;
      --surf2: #1d2236;
      --hov: #232844;
      --track: #2a3048;
      --hero1: #1a1f4d;
      --hero2: #2b1a4d;
      --cardbg: rgba(24, 28, 46, .94);
      --blob1: #252a6b;
      --blob2: #3a2470;
      --blob3: #16403a;
      --hbg: linear-gradient(110deg, #05070f, #2a2f66);
      --edge: #5a63a8;
      --edge2: #3d4476;
    }

    * {
      box-sizing: border-box
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--pri) 55%, transparent) transparent
    }

    @supports selector(::-webkit-scrollbar) {
      * {
        scrollbar-width: auto;
        scrollbar-color: auto
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px
      }

      ::-webkit-scrollbar-track {
        background: transparent
      }

      ::-webkit-scrollbar-corner {
        background: transparent
      }

      ::-webkit-scrollbar-thumb {
        border-radius: 99px;
        border: 3px solid transparent;
        background-clip: content-box;
        background-image: linear-gradient(180deg, var(--pri), var(--pri2));
        background-color: var(--pri);
        min-height: 36px;
        min-width: 36px
      }
    }

    html {
      scroll-behavior: smooth;
      max-width: 100%;
      overflow-x: hidden
    }

    body {
      margin: 0;
      min-height: 100vh;
      max-width: 100%;
      overflow-x: hidden;
      font: 14px/1.5 'Plus Jakarta Sans', system-ui, Segoe UI, Roboto, sans-serif;
      color: var(--ink);
      background: radial-gradient(900px 480px at 8% -10%, var(--hero1), transparent), radial-gradient(800px 460px at 100% 0, var(--hero2), transparent), var(--bg) fixed;
      transition: background .45s ease, color .45s ease
    }

    /* floating blobs behind the glass panels */
    .blobs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0
    }

    .blobs i {
      position: absolute;
      border-radius: 50%;
      opacity: .9;
      will-change: transform
    }

    .blobs i:nth-child(1) {
      width: 280px;
      height: 280px;
      left: -70px;
      bottom: -90px;
      background: radial-gradient(circle at 30% 30%, var(--blob1), transparent 72%)
    }

    .blobs i:nth-child(2) {
      width: 220px;
      height: 220px;
      right: -60px;
      top: 110px;
      background: radial-gradient(circle at 30% 30%, var(--blob2), transparent 72%)
    }

    .blobs i:nth-child(3) {
      width: 170px;
      height: 170px;
      right: 26%;
      bottom: -70px;
      border: 24px solid var(--blob3)
    }

    .blobs i.sp {
      opacity: 0;
      transition: opacity 2.2s ease;
      background: radial-gradient(circle at 30% 30%, var(--c), transparent 70%)
    }

    .blobs i.sp.on {
      opacity: .6
    }

    .blobs i.sp.ring {
      background: none;
      border: solid var(--c)
    }

    /* header: bold themed band */
    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 22px;
      color: #fff;
      background: var(--hbg);
      box-shadow: 0 8px 24px var(--glow);
      overflow: hidden
    }

    header::before {
      content: "";
      position: absolute;
      right: 20px;
      top: 8px;
      width: 90px;
      height: 30px;
      opacity: .5;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(circle, rgba(255, 255, 255, .7) 2px, transparent 2.5px) 0 0/12px 12px
    }

    header h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.3px
    }

    header h1::before {
      content: "";
      width: 24px;
      height: 24px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .28)
    }

    .swatches {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-left: auto;
      position: relative;
      z-index: 5
    }

    .sw {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .9) !important;
      background: linear-gradient(135deg, var(--a), var(--b)) !important;
      box-shadow: none
    }

    .sw:hover {
      transform: scale(1.18);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .95), 0 6px 14px rgba(0, 0, 0, .25)
    }

    .sw.on,
    .sw.on:hover {
      transform: scale(1.18);
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(0, 0, 0, .18)
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px
    }

    /* glass panels */
    .card {
      background: color-mix(in srgb, var(--cardbg) 88%, transparent);
      border: 1px solid var(--edge2);
      border-radius: 20px;
      padding: 16px;
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 10px 34px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .55)
    }

    [data-theme=dark] .card {
      border-color: rgba(255, 255, 255, .12);
      box-shadow: 0 10px 34px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08)
    }

    .mute {
      color: var(--mute)
    }

    .small {
      font-size: 12px
    }

    /* controls */
    button {
      font: inherit;
      font-weight: 600;
      border: 1px solid var(--edge);
      background: var(--surf);
      color: var(--ink);
      border-radius: 12px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background .15s, box-shadow .18s, transform .18s, filter .18s
    }

    button:hover {
      background: var(--hov);
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(23, 27, 45, .10)
    }

    button:active {
      transform: scale(.97)
    }

    button:focus-visible {
      outline: 2px solid var(--pri);
      outline-offset: 2px
    }

    button.pri {
      background: linear-gradient(120deg, var(--pri), var(--pri2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 16px var(--glow)
    }

    button.pri:hover {
      background: linear-gradient(120deg, var(--pri), var(--pri2));
      filter: brightness(1.06);
      transform: translateY(-2px)
    }

    [data-theme=dark] button.pri {
      color: #0f1220
    }

    button:disabled {
      opacity: .55;
      cursor: default;
      transform: none;
      box-shadow: none
    }

    button.wide {
      width: 100%;
      margin-top: 12px;
      padding: 11px
    }

    input,
    select {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--edge);
      border-radius: 12px;
      background: var(--surf2);
      color: var(--ink);
      width: 100%;
      transition: border-color .15s, box-shadow .15s
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--pri);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--pri) 22%, transparent);
      background: var(--surf)
    }

    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--mute)
    }

    label.chk {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin: 12px 0 0;
      cursor: pointer
    }

    label.chk input {
      width: auto;
      margin: 0
    }

    /* sign-in card */
    .gate {
      max-width: 420px;
      margin: 7vh auto;
      text-align: center;
      padding: 30px 24px
    }

    .gate .gi {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: linear-gradient(135deg, var(--pri), var(--pri2));
      box-shadow: 0 10px 24px var(--glow)
    }

    .gate h2 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 800;
      color: var(--pri)
    }

    .gate input#code {
      text-align: center;
      font: 800 22px ui-monospace, Consolas, monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 10px
    }

    .gate label.chk {
      justify-content: center
    }

    .err {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fdecec;
      color: #b42318;
      border: 1px solid #f5b5b5;
      border-left: 5px solid #ef4444;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.4
    }

    [data-theme=dark] .err {
      background: #3a1d22;
      color: #ffb4b4;
      border-color: #6b2b33
    }

    .err[hidden] {
      display: none
    }

    /* top controls + tabs */
    .ctl {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .hi {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.4px;
      color: var(--pri)
    }

    .ctr {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .ctr select {
      width: auto
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .tab {
      border-radius: 99px;
      padding: 7px 16px;
      background: var(--surf)
    }

    .tab small {
      opacity: .75;
      font-weight: 600
    }

    .tab.on,
    .tab.on:hover {
      background: linear-gradient(120deg, var(--pri), var(--pri2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 16px var(--glow)
    }

    [data-theme=dark] .tab.on {
      color: #0f1220
    }

    /* chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px 3px 4px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--surf);
      font-size: 12px;
      color: var(--mute);
      box-shadow: 0 1px 2px rgba(23, 27, 45, .04);
      transition: transform .18s, box-shadow .18s
    }

    .chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(23, 27, 45, .08)
    }

    .chip i {
      font-style: normal;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      background: var(--soft)
    }

    .chip b {
      color: var(--ink);
      font-weight: 800
    }

    .chip.hl {
      background: linear-gradient(120deg, var(--pri), var(--pri2));
      border-color: transparent;
      color: rgba(255, 255, 255, .85);
      box-shadow: 0 6px 16px var(--glow)
    }

    .chip.hl i {
      background: rgba(255, 255, 255, .22)
    }

    .chip.hl b {
      color: #fff
    }

    [data-theme=dark] .chip.hl,
    [data-theme=dark] .chip.hl b {
      color: #0f1220
    }

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    /* timetable */
    .gwrap {
      overflow-x: auto;
      border: 1px solid var(--edge2);
      border-radius: 16px;
      background: color-mix(in srgb, var(--surf) 94%, transparent)
    }

    .grid {
      width: 100%;
      min-width: 640px;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      text-align: center;
      color: var(--ink)
    }

    .grid th,
    .grid td {
      height: 28px;
      padding: 0 4px;
      overflow: hidden;
      line-height: 1.25;
      border-bottom: 1px solid color-mix(in srgb, var(--pri) 20%, var(--surf));
      border-right: 1px solid color-mix(in srgb, var(--pri) 12%, var(--surf))
    }

    .grid thead th {
      background: var(--soft);
      color: var(--pri);
      font-size: 11px;
      letter-spacing: .7px;
      padding: 7px 4px;
      font-weight: 700
    }

    .grid td.t {
      background: color-mix(in srgb, var(--soft) 55%, var(--surf));
      color: var(--mute);
      font-size: 10.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    .grid td.b1 {
      background: color-mix(in srgb, var(--soft) 75%, var(--surf))
    }

    .grid:not(.bh) tbody tr:hover td:not(.blk) {
      background-color: var(--hov)
    }

    .grid td.blk {
      padding: 2px 6px;
      font-weight: 700;
      text-transform: uppercase;
      border: 2px solid var(--surf);
      border-radius: 10px;
      position: relative
    }

    .blk .sj {
      display: block;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .2px;
      line-height: 1.15
    }

    .blk .in {
      display: block;
      font-size: 11px;
      font-weight: 700;
      opacity: .85;
      margin-top: 3px;
      line-height: 1.1
    }

    .blk .rm {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      opacity: .7;
      margin-top: 3px;
      line-height: 1.1;
      text-transform: none;
      letter-spacing: .3px
    }

    .grid td.one {
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .grid td.one .sj,
    .grid td.one .in,
    .grid td.one .rm {
      display: inline;
      margin: 0 8px 0 0;
      font-size: 11.5px
    }

    .grid td.one .sj {
      font-size: 12px
    }

    .grid td.one .in::before,
    .grid td.one .rm::before {
      content: "\00B7";
      margin-right: 8px;
      opacity: .5
    }

    .grid td.nt {
      background: repeating-linear-gradient(135deg, #fff3c4, #fff3c4 8px, #fff9df 8px, #fff9df 16px);
      color: #7a5b00;
      box-shadow: inset 3px 0 0 #e6b800
    }

    .grid td.lunch {
      background: repeating-linear-gradient(135deg, #dcf0fb, #dcf0fb 8px, #eef7fd 8px, #eef7fd 16px);
      color: #1f5f86;
      box-shadow: inset 3px 0 0 #6bb6e0
    }

    .grid td.lunch .sj,
    .grid td.nt .sj {
      letter-spacing: .6px
    }

    .grid tr.sum td {
      background: color-mix(in srgb, var(--soft) 65%, transparent);
      font-weight: 700;
      font-size: 12px
    }

    .grid tr.sum td.lbl {
      text-align: left;
      color: var(--mute);
      padding-left: 10px;
      font-size: 11px
    }

    .grid tr.sum:last-child td {
      background: var(--pri);
      color: #fff
    }

    .grid tr.sum:last-child td.lbl {
      color: #fff
    }

    [data-theme=dark] .grid tr.sum:last-child td,
    [data-theme=dark] .grid tr.sum:last-child td.lbl {
      color: #0f1220
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px
    }

    .lg {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 11px;
      border-radius: 99px;
      transition: transform .18s
    }

    .lg:hover {
      transform: translateY(-2px) scale(1.04)
    }

    .lg i {
      width: 8px;
      height: 8px;
      border-radius: 50%
    }

    .lg small {
      font-weight: 600;
      opacity: .8
    }

    .note {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 10px;
      padding: 8px 14px 8px 10px;
      font-size: 12px;
      color: var(--mute);
      background: linear-gradient(100deg, var(--soft), var(--surf));
      border: 1px solid var(--bd);
      border-left: 4px solid var(--pri);
      border-radius: 14px;
      box-shadow: 0 4px 14px var(--glow)
    }

    .note::before {
      content: "i";
      flex: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--pri), var(--pri2));
      color: #fff;
      font: italic 800 12px/1 Georgia, serif;
      box-shadow: 0 3px 8px var(--glow)
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--mute);
      font-weight: 600
    }

    /* dialog */
    dialog {
      border: none;
      border-radius: 24px;
      padding: 24px;
      width: min(440px, 92vw);
      background: var(--surf);
      color: var(--ink);
      box-shadow: 0 30px 80px rgba(23, 27, 45, .32);
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      overflow-y: auto
    }

    dialog[open] {
      animation: pop .18s ease
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.98)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    dialog::backdrop {
      background: rgba(23, 27, 45, .45);

  const fmt = m => (Math.floor(m / 60) % 12 || 12) + ':' + pad(m % 60);
  const fmtAP = m => fmt(m) + (m < 720 ? ' AM' : ' PM');
  const dayIdx = s => [...new Set([...String(s).replace(/Th/gi, 'H').toUpperCase()].map(c => DAYS.findIndex(d => d[0] === c)).filter(i => i >= 0))];
  const hrs = l => (toMin(l.End) - toMin(l.Start)) / 60;
  const n2 = x => Number(x.toFixed(2));
  const isLunch = l => l.Type === 'Lunch' || String(l.Subject).trim().toUpperCase() === 'LUNCH';
  const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  /* The page talks to Apps Script as plain JSON. No cookies are sent, so Google never has to pick
     an account, and teachers who are signed in to several Google accounts are not affected. */
  const API_URL = 'https://script.google.com/macros/s/AKfycbyNN2wYvaQVhQWLX1g-111p99wAu3VwQlshMjyWf4Cg1Q_0LWCc3R7DiVxTnX6eZs_N/exec';
  async function api(code, term) {
    let res;
    try {
      res = await fetch(API_URL, {method: 'POST', credentials: 'omit', body: JSON.stringify({action: 'teacher', code: code, term: term || ''})});
    } catch (e1) {
      try {
        res = await fetch(API_URL + '?action=teacher&code=' + encodeURIComponent(code) + '&term=' + encodeURIComponent(term || ''), {credentials: 'omit'});
      } catch (e2) { throw new Error('Could not reach the server. Check your internet connection and try again.'); }
    }
    try { return await res.json(); }
    catch (e3) { throw new Error('The server sent an unexpected reply. Please try again in a moment.'); }
  }

  /* ----- section tag colours: same section = same colour, and different sections on one timetable never look alike ----- */
  const secKey = s => String(s || '').replace(/[\s\-_]/g, '').toUpperCase();
  function secParts(s) {
    const seen = {}, out = [];
    String(s || '').split(/[,;+\/&]/).forEach(p => { p = p.trim(); const k = secKey(p); if (k && !seen[k]) { seen[k] = 1; out.push(p); } });
    return out;
  }
  const strHash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h; };
  function secHueMap(loads) {
    const byKey = new Map();
    loads.forEach(l => secParts(l.Section).forEach(p => { if (!byKey.has(secKey(p))) byKey.set(secKey(p), p); }));
    const names = [...byKey.values()].sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
    const used = [], map = {};
    const far = h => used.every(u => { const d = Math.abs(h - u); return Math.min(d, 360 - d) >= 24; });
    names.forEach(n => {
      let h = strHash(secKey(n)) % 360;
      for (let i = 0; i < 15 && !far(h); i++) h = (h + 25) % 360;
      used.push(h); map[secKey(n)] = h;
    });
    return map;
  }
  const secPills = (txt, map) => secParts(txt).map(p => '<span class="stag" style="--sc:' + (map[secKey(p)] != null ? map[secKey(p)] : strHash(secKey(p)) % 360) + '">' + esc(p) + '</span>').join('');

  function toast(msg, bad) {
    const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : '';
    t.popover = 'manual';
    try { t.hidePopover(); } catch (e) {}
    try { t.showPopover(); } catch (e) {}
    t.style.display = 'block'; clearTimeout(toast.t);
    toast.t = setTimeout(() => { t.style.display = 'none'; try { t.hidePopover(); } catch (e) {} }, 5000);
  }

  /* same pastel colour per subject as the main app */
  const HUES = [350, 15, 35, 50, 90, 140, 165, 185, 205, 225, 250, 275, 300, 325];
  function subjHue(subj) {
    const k = String(subj).trim().toUpperCase(); let h = 5381;
    for (let i = 0; i < k.length; i++) h = ((h << 5) + h + k.charCodeAt(i)) >>> 0;
    return HUES[h % HUES.length] + (h >> 8) % 11 - 5;
  }
  const subjCol = s => { const h = subjHue(s); return {bg: 'hsl(' + h + ' 78% 89%)', bar: 'hsl(' + h + ' 55% 62%)', ink: 'hsl(' + h + ' 45% 22%)'}; };

  const SUF = new Set(['JR','SR','II','III','IV','V','PHD','EDD','DBA','MA','MAED','MS','MD','LPT','RGC','RPM']);
  const PRE = new Set(['DE','DEL','DELA','DELAS','DELOS','DI','DA','LA','LE','SAN','SANTA','VAN','VON','PALO']);
  function lastName(name) {
    const w = String(name || '').trim().split(',').join(' ').split(/\s+/).filter(Boolean);
    while (w.length > 1 && SUF.has(w[w.length - 1].split('.').join('').toUpperCase())) w.pop();
    let i = w.length - 1;
    while (i > 0 && PRE.has(w[i - 1].split('.').join('').toUpperCase())) i--;
    return w.slice(i).join(' ');
  }
  const shortP = id => { const p = D && D.people[id]; return p ? ((p.Title ? p.Title + ' ' : '') + lastName(p.Name)).toUpperCase() : ''; };

  let D = null, CODE = '', TAB = 'me', TERM = '', REMEMBER = true;

  /* ---------- themes ---------- */
  const THEMES = [['indigo','Indigo','#5b5bf0','#8b5cf6'], ['ocean','Ocean','#0891b2','#3b82f6'],
    ['forest','Forest','#059669','#65a30d'], ['sunset','Sunset','#f97316','#ec4899'], ['dark','Midnight','#171b2d','#5b5bf0']];
  function setTheme(t, save) {
    if (!THEMES.some(x => x[0] === t)) t = 'indigo';
    document.documentElement.dataset.theme = t;
    document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    if (save) { try { localStorage.setItem('fl-theme', t); } catch (e) {} }
  }
  $('themes').innerHTML = THEMES.map(t =>
    '<button class="sw" data-t="' + t[0] + '" title="' + t[1] + '" style="--a:' + t[2] + ';--b:' + t[3] + '"></button>').join('');
  document.querySelectorAll('.sw').forEach(b => { b.onclick = () => setTheme(b.dataset.t, true); });
  (function () { let t = 'indigo'; try { t = localStorage.getItem('fl-theme') || 'indigo'; } catch (e) {} setTheme(t); })();

  /* ---------- blobs wander, and new ones spawn at random ---------- */
  (function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || matchMedia('(max-width: 700px)').matches || !Element.prototype.animate) return;
    const host = document.querySelector('.blobs');
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const css = o => 'translate(' + o.x + 'px,' + o.y + 'px) scale(' + o.s + ') rotate(' + o.r + 'deg)';
    const COLORS = ['var(--blob1)', 'var(--blob2)', 'var(--blob3)', 'var(--pri)', 'var(--pri2)'];
    const MAX = 6; let count = 0;
    function wander(el, cx, cy) {
      let cur = {x: 0, y: 0, s: 1, r: 0};
      const hop = () => {
        if (!el.isConnected) return;
        const W = innerWidth, H = innerHeight;
        const nxt = {x: rnd(W * .05, W * .95) - cx, y: rnd(H * .05, H * .95) - cy, s: rnd(.8, 1.35), r: rnd(-45, 45)};
        const a = el.animate([{transform: css(cur)}, {transform: css(nxt)}], {duration: rnd(7000, 16000), easing: 'ease-in-out'});
        a.onfinish = () => { cur = nxt; el.style.transform = css(cur); hop(); };
      };
      hop();
    }
    function spawn() {
      if (document.hidden || count >= MAX) return;
      count++;
      const W = innerWidth, H = innerHeight, sz = rnd(110, 320), ring = Math.random() < .3;
      const el = document.createElement('i');
      el.className = 'sp' + (ring ? ' ring' : '');
      el.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + rnd(0, W - sz) + 'px;top:' + rnd(0, H - sz) + 'px;' + (ring ? 'border-width:' + rnd(14, 26) + 'px;' : '');
      el.style.setProperty('--c', pick(COLORS));
      host.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
      wander(el, parseFloat(el.style.left) + sz / 2, parseFloat(el.style.top) + sz / 2);
      setTimeout(() => { el.classList.remove('on'); setTimeout(() => { el.remove(); count--; }, 2300); }, rnd(14000, 32000));
    }
    host.querySelectorAll('i').forEach(el => {
      const r = el.getBoundingClientRect();
      wander(el, r.left + r.width / 2, r.top + r.height / 2);
    });
    for (let i = 0; i < 3; i++) setTimeout(spawn, i * 700);
    (function loop() { spawn(); setTimeout(loop, rnd(1800, 4200)); })();
  })();

  /* ---------- sign in ---------- */
  function showGate(msg) {
    document.body.classList.remove('in');
    D = null;
    $('app').innerHTML = '<div class="card gate"><div class="gi">' + E.key + '</div><h2>Teacher access</h2>'
      + '<p class="mute">Type the access code from your SHS Coordinator to see your loading and your advisory classes. No school login needed.</p>'
      + '<input id="code" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9">'
      + '<label class="chk"><input type="checkbox" id="rem" checked> Remember me on this device</label>'
      + '<div id="gerr" class="err"' + (msg ? '' : ' hidden') + '>' + esc(msg || '') + '</div>'
      + '<button class="pri wide" id="go">Open my loading</button></div>';
    const inp = $('code');
    inp.oninput = () => { const v = normCode(inp.value).slice(0, 8); inp.value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v; $('gerr').hidden = true; };
    inp.onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
    $('go').onclick = async () => {
      const c = normCode(inp.value);
      if (c.length < 8) { $('gerr').textContent = 'Please type your 8-character code.'; $('gerr').hidden = false; return; }
      REMEMBER = $('rem').checked;
      $('go').disabled = true; $('go').textContent = 'Checking' + E.ell;
      await signIn(c, '', {});
    };
    inp.focus();
  }

async function signIn(code, term, opts) {
  try {
    const r = await api(code, term);
    if (!r.ok) {
      if (opts.keep) { render(); toast(r.error || 'Could not load', true); return false; }
      if (opts.stored) { try { localStorage.removeItem('tc-code'); } catch (e) {} }
      showGate(r.error); return false;
    }
    CODE = code; D = r; TERM = r.term;
    try {
      if (REMEMBER) localStorage.setItem('tc-code', code); else localStorage.removeItem('tc-code');
      localStorage.setItem('tc-term', TERM);
    } catch (e) {}
    if (TAB !== 'me' && !D.sections.some(s => s.key === TAB)) TAB = 'me';
    render(); return true;
  } catch (e) {
    if (opts.keep) { render(); toast(e.message || String(e), true); return false; }
    showGate(e.message || String(e)); return false;
  }
}   

  function signOut() {
    try { localStorage.removeItem('tc-code'); } catch (e) {}
    CODE = ''; TAB = 'me'; showGate();
  }

  /* ---------- timetable ---------- */
  function current() {
    if (TAB !== 'me') { const s = D.sections.find(x => x.key === TAB); if (s) return {kind: 'sec', name: s.name, loads: s.loads, sec: s}; }
    return {kind: 'me', name: D.me.Name, loads: D.loads};
  }

  function gridHtml(loads, tD, nD, isMe) {
    const S = toMin(D.config.dayStart), E2 = toMin(D.config.dayEnd), n = (E2 - S) / 30;
    const starts = DAYS.map(() => ({})), cov = DAYS.map(() => ({}));
    const SH = isMe ? secHueMap(loads) : {};
    loads.forEach(l => {
      const a = (toMin(l.Start) - S) / 30, b = (toMin(l.End) - S) / 30;
      if (a < 0 || b > n || b <= a) return;
      dayIdx(l.Days).forEach(di => { starts[di][a] = {l: l, span: b - a}; for (let k = a + 1; k < b; k++) cov[di][k] = 1; });
    });
    let h = '<table class="grid"><colgroup><col style="width:52px"><col style="width:52px"><col span="5"></colgroup>'
      + '<thead><tr><th colspan="2">TIME</th><th colspan="5">DAYS</th></tr><tr><th>FROM</th><th>TO</th>'
      + DAYS.map(d => '<th>' + d[2] + '</th>').join('') + '</tr></thead><tbody>';
    for (let i = 0; i < n; i++) {
      const t = S + i * 30, band = Math.floor(i / 3) % 2 ? 'b1' : '';
      h += '<tr><td class="t">' + fmt(t) + '</td><td class="t">' + fmt(t + 30) + '</td>';
      DAYS.forEach((d, di) => {
        if (cov[di][i]) return;
        const s = starts[di][i];
        if (!s) { h += '<td class="' + band + '"></td>'; return; }
        const l = s.l, lunch = isLunch(l), cl = l.Type === 'Class' && !lunch;
        const kind = lunch ? 'lunch' : cl ? 'cls' : 'nt';
        const who = isMe ? esc(l.Section) : esc(l.FacultyID ? shortP(l.FacultyID) : '');
        const rm = esc(l.Room || '');
        const whoHtml = isMe ? secPills(l.Section, SH) : who;
        const body = s.span === 1
          ? '<span class="sj">' + esc(l.Subject) + '</span>' + (who ? '<span class="in">' + whoHtml + '</span>' : '') + (rm ? '<span class="rm">' + rm + '</span>' : '')
          : '<div class="sj">' + esc(l.Subject) + '</div>' + (who ? '<div class="in">' + whoHtml + '</div>' : '') + (rm ? '<div class="rm">' + rm + '</div>' : '');
        let style = '';
        if (cl) { const k = subjCol(l.Subject); style = ' style="background:' + k.bg + ';color:' + k.ink + ';box-shadow:inset 4px 0 0 ' + k.bar + '"'; }
        const tip = [l.Subject, who, l.Room, l.Days + ' ' + fmtAP(toMin(l.Start)) + E.en + fmtAP(toMin(l.End))].filter(Boolean).join(' ' + E.dot + ' ');
        h += '<td rowspan="' + s.span + '" class="blk ' + kind + (s.span === 1 ? ' one' : '') + '"' + style
  + ' data-s="' + esc(String(l.Subject).trim().toUpperCase()) + '" data-a="' + i + '" data-n="' + s.span + '"'
  + ' title="' + esc(tip) + '">' + body + '</td>';
      });
      h += '</tr>';
    }
    const sum = (label, arr) => '<tr class="sum"><td colspan="2" class="lbl">' + label + '</td>' + arr.map(v => '<td>' + n2(v) + '</td>').join('') + '</tr>';
    return h + (isMe ? sum('Non-Teaching', nD) + sum('Teaching', tD) + sum('Total', tD.map((v, i) => v + nD[i])) : sum('Total', tD)) + '</tbody></table>';
  }

  const chip = (ico, label, val, hl) => '<span class="chip' + (hl ? ' hl' : '') + '"><i>' + ico + '</i>' + (label ? label + ' ' : '') + '<b>' + val + '</b></span>';

  function sheetHtml() {
    const cur = current(), loads = cur.loads, isMe = cur.kind === 'me';
    const tD = [0, 0, 0, 0, 0], nD = [0, 0, 0, 0, 0];
    loads.forEach(l => dayIdx(l.Days).forEach(di => { if (l.Type === 'Class') tD[di] += hrs(l); else if (!isLunch(l)) nD[di] += hrs(l); }));
    const T = tD.reduce((a, b) => a + b, 0), N = nD.reduce((a, b) => a + b, 0);
    const cls = loads.filter(l => l.Type === 'Class');
    const subs = [...new Set(cls.map(l => String(l.Subject).trim().toUpperCase()))].sort();
    let chips;
    if (isMe) {
      const m = D.me;
      chips = chip(E.school, '', esc(m.Department || 'Senior High') + ' ' + E.dot + ' ' + esc(m.Status || ''))
        + chip(E.books, 'Preps', subs.length) + chip(E.pencil, 'Teaching', n2(T) + ' hrs') + chip(E.files, 'Non-teaching', n2(N) + ' hrs')
        + chip(E.timer, 'Total', n2(T + N) + (Number(m.MaxUnits) ? ' / ' + m.MaxUnits : '') + ' hrs', true);
    } else {
      const s = cur.sec, teachers = new Set(cls.map(l => l.FacultyID).filter(Boolean)).size;
      chips = (s.adviser ? chip(E.cap, 'Adviser', esc(s.adviser)) : '') + (s.room ? chip(E.door, 'Home room', esc(s.room)) : '')
        + chip(E.books, 'Subjects', subs.length) + chip(E.teachers, 'Teachers', teachers) + chip(E.timer, 'Total', n2(T) + ' hrs/week', true);
    }
    const legend = subs.length ? '<div class="legend">' + subs.map(sub => {
      const c = subjCol(sub);
      const who = isMe ? '' : [...new Set(cls.filter(l => String(l.Subject).trim().toUpperCase() === sub).map(l => shortP(l.FacultyID)).filter(Boolean))].join(', ');
      return '<span class="lg" data-s="' + esc(sub) + '" style="background:' + c.bg + ';color:' + c.ink + '"><i style="background:' + c.bar + '"></i>' + esc(sub)
        + (who ? ' <small>' + E.dot + ' ' + esc(who) + '</small>' : '') + '</span>';
    }).join('') + '</div>' : '';
    const body = loads.length ? '<div class="gwrap">' + gridHtml(loads, tD, nD, isMe) + '</div>' + legend
      : '<div class="empty">Nothing is scheduled yet for ' + esc(TERM) + '.</div>';
    return '<div class="top"><div class="chips">' + chips + '</div>'
      + '<div class="btns"><button onclick="doPrint()">' + E.print + ' Print</button><button onclick="openIcs()">' + E.cal + ' Add to calendar</button></div></div>'
      + body + '<div class="note">Read-only view. If something looks wrong, tell the Principal or Assistant Principal.</div>';
  }

  function render() {
    const m = D.me;
    document.body.classList.add('in');
    const tabs = '<button class="tab' + (TAB === 'me' ? ' on' : '') + '" data-k="me">' + E.me + ' My loading</button>'
      + D.sections.map(s => '<button class="tab' + (TAB === s.key ? ' on' : '') + '" data-k="' + esc(s.key) + '">' + E.cap + ' ' + esc(s.name) + ' <small>advisory</small></button>').join('');
    $('app').innerHTML =
      '<div class="ctl"><div><div class="hi">Hello, ' + esc(m.Title ? m.Title + ' ' : '') + esc(lastName(m.Name)) + ' ' + E.wave + '</div><div class="mute">' + esc(m.Name) + '</div></div>'
      + '<div class="ctr"><div class="termdd" id="termDd"><button type="button" id="termBtn"><span id="termLbl">' + esc(TERM) + '</span></button></div>'
      + '<button id="rf">' + E.refresh + ' Refresh</button><button id="so">Sign out</button></div></div>'
      + '<div class="tabs">' + tabs + '</div>'
      + '<section class="card" id="sheetCard">' + sheetHtml() + '</section>';
    initTermDd();
    $('rf').onclick = async () => { showLoading('Refreshing' + E.ell); const ok = await signIn(CODE, TERM, {keep: true}); if (ok) toast('Up to date'); };
    $('so').onclick = signOut;
    document.querySelectorAll('.tab').forEach(b => { b.onclick = () => { TAB = b.dataset.k; render(); }; });
    wireSheet(); fitSheet(); watchFit();
  }

/* ---------- hover highlight + legend spotlight ---------- */
function wireSheet() {
  const sheet = document.querySelector('#sheetCard .gwrap'); if (!sheet) return;
  const tbl = sheet.querySelector('.grid'), rows = tbl.tBodies[0].rows;
  const clearT = () => { tbl.classList.remove('bh'); tbl.querySelectorAll('td.tm,td.edge').forEach(c => c.classList.remove('tm', 'edge')); };
  sheet.onmouseover = e => {
    const td = e.target.closest('td.blk'); clearT();
    if (!td) return;
    const a = +td.dataset.a, n = +td.dataset.n;
    tbl.classList.add('bh');
    for (let k = a; k < a + n; k++) rows[k].querySelectorAll('td.t').forEach(c => c.classList.add('tm'));
    rows[a].cells[0].classList.add('edge');
    rows[a + n - 1].cells[1].classList.add('edge');
  };
  sheet.onmouseleave = clearT;
  document.querySelectorAll('#sheetCard .lg').forEach(p => {
    p.onmouseenter = () => { sheet.classList.add('focus'); sheet.querySelectorAll('td.blk').forEach(td => td.classList.toggle('hit', td.dataset.s === p.dataset.s)); };
    p.onmouseleave = () => sheet.classList.remove('focus');
  });
}

  function openIcs() {

  function buildIcs() {
    const cur = current(), a = $('iStart').value, b = $('iEnd').value;
    if (!a || !b) { toast('Pick the first and last day', true); return null; }
    const pd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return new Date(+m[1], +m[2] - 1, +m[3]); };
    const d1 = pd(a), d2 = pd(b);
    if (d2 < d1) { toast('The last day must be after the first day', true); return null; }
    if ((d2 - d1) / 864e5 > 400) { toast('Keep the date range under about a year', true); return null; }
    const ymd = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    const hm = s => pad(Math.floor(toMin(s) / 60)) + pad(toMin(s) % 60) + '00';
    const tx = s => String(s || '').split(BS).join(BS + BS).split(';').join(BS + ';').split(',').join(BS + ',').split(CR).join('').split(LF).join(BS + 'n');
    const fold = line => { let o = '', s = line; while (s.length > 74) { o += s.slice(0, 74) + CRLF + ' '; s = s.slice(74); } return o + s; };
    const BYDAY = ['MO', 'TU', 'WE', 'TH', 'FR'];
    const now = new Date(), stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';
    const until = ymd(d2) + 'T155959Z';
    const out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//AC SHS Load Manager//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'X-WR-CALNAME:' + tx(cur.name + ' ' + E.dot + ' ' + TERM), 'X-WR-TIMEZONE:Asia/Manila',
      'BEGIN:VTIMEZONE', 'TZID:Asia/Manila', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0800', 'TZOFFSETTO:+0800', 'TZNAME:PST', 'END:STANDARD', 'END:VTIMEZONE'];
    let n = 0;
    cur.loads.forEach(l => {
      const lunch = isLunch(l);
      if (lunch && !$('iLu').checked) return;
      if (!lunch && l.Type !== 'Class' && !$('iNT').checked) return;
      const di = dayIdx(l.Days); if (!di.length) return;
      let first = null;
      for (let k = 0; k < 7 && !first; k++) {
        const d = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate() + k);
        if (di.includes(d.getDay() - 1)) first = d;
      }
      if (!first || first > d2) return;
      const who = l.FacultyID && D.people[l.FacultyID] ? D.people[l.FacultyID].Name : '';
      const title = [l.Subject, l.Section].filter(Boolean).join(' ' + E.dot + ' ');
      const desc = [cur.kind !== 'me' && who ? who : '', TERM, l.Days + ' ' + fmtAP(toMin(l.Start)) + ' ' + E.en + ' ' + fmtAP(toMin(l.End))].filter(Boolean).join(LF);
      out.push('BEGIN:VEVENT', 'UID:' + l.ID + '@acshs-loadmanager', 'DTSTAMP:' + stamp,
        'DTSTART;TZID=Asia/Manila:' + ymd(first) + 'T' + hm(l.Start), 'DTEND;TZID=Asia/Manila:' + ymd(first) + 'T' + hm(l.End),
        'RRULE:FREQ=WEEKLY;BYDAY=' + di.slice().sort((x, y) => x - y).map(i => BYDAY[i]).join(',') + ';UNTIL=' + until,
        'SUMMARY:' + tx(title || l.Subject), l.Room ? 'LOCATION:' + tx(l.Room) : '', 'DESCRIPTION:' + tx(desc), 'END:VEVENT');
      n++;
    });
    if (!n) { toast('Nothing to export with these options', true); return null; }
    out.push('END:VCALENDAR');
    return {text: out.filter(Boolean).map(fold).join(CRLF) + CRLF, name: (cur.name + ' - ' + TERM).replace(/[^\w .\-]+/g, '') + '.ics'};
  }

  $('icsX').onclick = () => $('icsDlg').close();
  $('icsD').onclick = () => {
    const r = buildIcs(); if (!r) return;
    try {
      const blob = new Blob([r.text], {type: 'text/calendar;charset=utf-8'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = r.name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      $('icsDlg').close(); toast('Calendar file downloaded');
    } catch (e) { toast('Could not download. Use Copy text instead.', true); }
  };
  $('icsC').onclick = () => {
    const r = buildIcs(); if (!r) return;
    const t = document.createElement('textarea'); t.value = r.text; t.style.cssText = 'position:fixed;opacity:0';
    $('icsDlg').appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    t.remove();
    toast(ok ? 'Copied. Paste into a text file and save it as ' + r.name : 'Could not copy. Try Download instead.', !ok);
  };

  /* ---------- fit the timetable to the window ---------- */
  const FULL_MQ = '(min-width:901px) and (min-height:700px)';
  let RO = null, roT;

  function fitSheet() {
    const card = $('sheetCard'); if (!card) return;
    card.style.removeProperty('--tt');
    if (!matchMedia(FULL_MQ).matches) return;          // small screens scroll normally
    const wrap = card.querySelector('.gwrap'), tbl = wrap && wrap.querySelector('.grid');
    if (!tbl) return;
    let s = 1;
    for (let i = 0; i < 16; i++) {
      card.style.setProperty('--tt', s);
      if (tbl.offsetHeight <= wrap.clientHeight + 1) break;   // everything fits, totals included
      s = Math.max(.35, +(s - .05).toFixed(2));
    }
  }

  function watchFit() {
    const w = document.querySelector('#sheetCard .gwrap');
    if (RO) { RO.disconnect(); RO = null; }
    if (!w || !window.ResizeObserver) return;
    RO = new ResizeObserver(() => { clearTimeout(roT); roT = setTimeout(fitSheet, 60); });
    RO.observe(w);
  }
  addEventListener('resize', () => { clearTimeout(roT); roT = setTimeout(fitSheet, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitSheet);

  /* ---------- start ---------- */
  (function () {
    let c = '', t = '';
    try { c = localStorage.getItem('tc-code') || ''; t = localStorage.getItem('tc-term') || ''; } catch (e) {}
    if (c) { $('app').innerHTML = '<div class="card gate"><p class="mute">Opening your loading' + E.ell + '</p></div>'; REMEMBER = true; signIn(c, t, {stored: true}); }
    else showGate();
  })();
  </script>
</body>
