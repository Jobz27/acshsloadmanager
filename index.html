<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC SHS | Teacher Access</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/Y7gR9QbY/AC-SHS-Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#e9eaff;--card:#fff;--ink:#171b2d;--mute:#6b7390;--line:#e6e8f2;--pri:#5b5bf0;--pri2:#8b5cf6}
  @media(prefers-color-scheme:dark){:root{--bg:#0b0d1a;--card:#171b2e;--ink:#e8eaf6;--mute:#9aa3c2;--line:#2a3048}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:15px/1.55 'Plus Jakarta Sans',system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #load{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:20px;
    background:radial-gradient(800px 420px at 10% -10%,#c9c8ff88,transparent),radial-gradient(700px 400px at 100% 0,#ecd9ff88,transparent),var(--bg);
    transition:opacity .45s ease,visibility .45s}
  #load.out{opacity:0;visibility:hidden}
  .ld{width:min(380px,100%);text-align:center;padding:34px 28px;border-radius:28px;background:var(--card);
    border:1px solid var(--line);box-shadow:0 24px 70px rgba(40,40,110,.2)}
  .ring{position:relative;width:104px;height:104px;margin:0 auto 18px;display:grid;place-items:center}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,transparent 0 50%,var(--pri),var(--pri2),transparent);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
    animation:spin 1.2s linear infinite}
  .ring img{width:80px;height:80px;border-radius:50%;object-fit:contain}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
  p{margin:0;color:var(--mute)}
  #slow{margin-top:18px}
  #slow[hidden]{display:none}
  .btn{display:block;margin-top:10px;padding:12px 16px;border-radius:14px;font-weight:700;text-decoration:none;
    color:#fff;background:linear-gradient(120deg,var(--pri),var(--pri2))}
  @media(prefers-reduced-motion:reduce){.ring::before{animation:none}}
</style>
</head>
<body>
  <iframe id="app" title="Asian College Senior High School Teacher Access" allow="fullscreen"></iframe>

  <div id="load">
    <div class="ld">
      <div class="ring"><img alt="" src="https://i.ibb.co/Y7gR9QbY/AC-SHS-Logo.png"></div>
      <h1>Teacher Access</h1>
      <p>Opening your loading…</p>
      <div id="slow" hidden>
        <p>This is taking longer than usual.</p>
        <a id="direct" class="btn" href="#">Open it directly</a>
      </div>
    </div>
  </div>

<script>
  const TEACHER_URL = "https://script.google.com/macros/s/AKfycbyNN2wYvaQVhQWLX1g-111p99wAu3VwQlshMjyWf4Cg1Q_0LWCc3R7DiVxTnX6eZs_N/exec?page=teacher";
  const $ = id => document.getElementById(id);
  let done = false;
  const slowTimer = setTimeout(() => { if (!done) $('slow').hidden = false; }, 12000);

  function ready() {
    if (done) return;
    done = true; clearTimeout(slowTimer);
    $('load').classList.add('out');
    setTimeout(() => $('load').remove(), 500);
  }

  window.addEventListener('message', e => {
    let ok = false;
    try { ok = /\.googleusercontent\.com$/.test(new URL(e.origin).hostname); } catch (x) {}
    if (ok && e.data && e.data.acLoadManager === 'ready') ready();
  });

  const TEACHER_URL = "https://script.google.com/macros/s/AKfycbyNN2wYvaQVhQWLX1g-111p99wAu3VwQlshMjyWf4Cg1Q_0LWCc3R7DiVxTnX6eZs_N/exec?page=teacher";
  $('direct').href = TEACHER_URL;
  $('app').src = TEACHER_URL;
</script>
</body>
</html>
